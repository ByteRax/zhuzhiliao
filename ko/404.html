<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#0a1028">
<title>페이지를 찾을 수 없습니다 · Zhuzhiliao</title>
<style>
  html,body{
    height:100%; margin:0; background:#0a1028; color:#f0e6d2;
    font-family:"Songti SC","Noto Serif SC","Noto Serif CJK SC","STSong","SimSun",serif;
    display:flex; align-items:center; justify-content:center; text-align:center;
  }
  main{ line-height:2.2; letter-spacing:.12em; padding:24px; }
  h1{ font-size:22px; font-weight:700; letter-spacing:.3em; color:#ffcf9e; margin:0 0 6px; }
  p{ margin:0; opacity:.7; font-size:14px; }
  a{
    display:inline-block; margin-top:18px; padding:10px 26px;
    color:#f0e6d2; text-decoration:none; font-size:14px; letter-spacing:.3em;
    border:1px solid rgba(226,96,63,.55); border-radius:999px;
    transition:all .25s ease;
  }
  a:hover{ border-color:#e2603f; color:#ffcf9e; box-shadow:0 0 18px rgba(226,96,63,.25); }
</style>
</head>
<body>
<main>
  <h1>여기엔 매미 소리가 없습니다</h1>
  <p>찾으시는 페이지가 존재하지 않습니다(404).</p>
